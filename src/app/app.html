@if (isLoggedIn()) {

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">

    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand fw-bold text-primary" routerLink="/dashboard">
            <i class="bi bi-tools me-2"></i>
            Home Service Captain
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#captainNavbar"
            aria-controls="captainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="captainNavbar">

            <div class="navbar-nav ms-auto align-items-lg-center">

                <!-- Dashboard -->
                <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }">
                    <i class="bi bi-speedometer2 me-1"></i>
                    Dashboard
                </a>

                <!-- Jobs -->
                <a class="nav-link" routerLink="/jobs" routerLinkActive="active">
                    <i class="bi bi-briefcase me-1"></i>
                    Jobs
                </a>
                <a routerLink="/jobs/history" class="nav-link">
                    <i class="bi bi-clock-history me-2"></i>
                    Job History
                </a>

                <!-- My Services -->
                <a class="nav-link" routerLink="/my-services" routerLinkActive="active">
                    <i class="bi bi-tools me-1"></i>
                    My Services
                </a>

                <!-- Profile -->
                <a class="nav-link" routerLink="/profile" routerLinkActive="active">
                    <i class="bi bi-person-circle me-1"></i>
                    Profile
                </a>

                <!-- Captain Name -->
                <span class="captain-name ms-lg-3">
                    <i class="bi bi-person-badge me-1"></i>
                    {{ getCaptainName() }}
                </span>

                <!-- Logout -->
                <button type="button" class="btn btn-outline-danger btn-sm ms-lg-3 mt-2 mt-lg-0" (click)="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Logout
                </button>

            </div>

        </div>

    </div>

</nav>

}

<main>
    <router-outlet></router-outlet>
</main>
